<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Senha</title>
    <link rel="stylesheet" href="./css/novasenha.css">
</head>
<body>

    <div class="card">
        <h1>Nova Senha</h1>
        
        <p class="description">
            Digite a sua nova senha e confirme abaixo para redefinir o seu acesso.
        </p>

        <form>
            <div class="form-group">
                <label for="senha">Nova Senha:</label>
                <input type="password" id="senha" name="senha" placeholder="Digite a sua nova senha">
            </div>

            <div class="form-group">
                <label for="confirmar-senha">Confirmar Senha:</label>
                <input type="password" id="confirmar-senha" name="confirmar-senha" placeholder="Confirme a sua nova senha">
            </div>

            <a href="login.html" class="btn-submit">Redefinir Senha</a>
        </form>

        <div class="back-link">
            <a href="login.html">Voltar para o Login</a>
        </div>
    </div>

</body>
</html>
